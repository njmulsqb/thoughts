<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ site.description }}">
    <title>{% if page.title and page.title != '' %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>
  <body>
    <main class="page">
      <header class="site-header">
        <a class="site-title" href="{{ '/' | relative_url }}"><span lang="ur" dir="rtl" class="site-title-urdu">میرے خیالات</span><span class="site-title-divider" aria-hidden="true">·</span><span>Thoughts</span></a>
        <p lang="ur" dir="rtl" class="site-author">{{ site.author_urdu }}</p>
        <p class="site-description">{{ site.description }}</p>
        <nav aria-label="Main navigation">
          <a href="{{ '/' | relative_url }}">Thoughts</a>
          <span aria-hidden="true">·</span>
          <a href="{{ '/archive/' | relative_url }}">Archive</a>
          <span aria-hidden="true">·</span>
          <a href="{{ '/about/' | relative_url }}">About</a>
          <span aria-hidden="true">·</span>
          <a href="{{ '/digital-presence/' | relative_url }}">Digital presence</a>
        </nav>
      </header>

      {{ content }}
    </main>

    <footer class="site-footer">
      <nav aria-label="Footer navigation">
        <a href="{{ '/digital-presence/' | relative_url }}">Digital presence</a>
      </nav>
    </footer>
  </body>
</html>
